# ===== Gradle 基础设置 =====
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=false
# 本机 JDK 25（Loom 1.18+ 本身要求 JVM 25；编译目标仍是 Java 21 = MC 1.21.11 的运行环境）
#
# ⚠ 这一行是**本机路径**，不能提交到仓库（别人 clone 下来会报错）。
#   如果你本地需要指定 JDK，就在自己机器上取消注释并改成你的路径；
#   或者用环境变量 / IDE 设置指定。
# org.gradle.java.home=C:\\Program Files\\Java\\jdk-25.0.4.1

# ===== Fabric / Minecraft 版本矩阵 =====
# 版本对照见 https://fabricmc.net/develop
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_version=0.19.4
loom_version=1.18.3
fabric_api_version=0.141.6+1.21.11

# ===== Mod 元信息 =====
mod_version=1.5.1_hotfix2
maven_group=com.yue
archives_base_name=SayoHonami_Music
